santaka_confluence:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', '<orgname-accountname>') }}"
      user: "{{ env_var('SNOWFLAKE_USER', '<login name>') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH', '<absolute path to rsa_key.p8>') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'ACCOUNTADMIN') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'SANTAKA_DEMO_WH') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'SANTAKA_DEMO') }}"
      schema: dev
      threads: 4
